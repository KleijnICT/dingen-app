name: Release

# Every push to main is a release. The version comes from package.json; the
# run fails if that version was already released, so bump it on develop first.
# Pre-releases (a version with "-") also become :latest; main is what testers run.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      short: ${{ steps.v.outputs.short }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Bump the version in package.json and add it to CHANGELOG.md on develop."
            exit 1
          fi
          grep -q "^## $version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $version."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image:
    runs-on: ubuntu-latest
    needs: [version, check]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kleijnict/dingen
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Dingen
            org.opencontainers.image.description=Self-hosted GTD task manager with an offline-first web app and a built-in MCP server
            org.opencontainers.image.licenses=GPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DINGEN_VERSION=${{ needs.version.outputs.version }}
            DINGEN_COMMIT=${{ needs.version.outputs.short }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [version, image]
    steps:
      - uses: actions/checkout@v4
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Release notes: the CHANGELOG section for this version.
          awk -v v="## $VERSION" '$0 ~ "^## " { if (found) exit; if (index($0, v) == 1) { found = 1; next } } found' CHANGELOG.md > notes.md
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Dingen $VERSION" --notes-file notes.md $flags

  deploy:
    runs-on: ubuntu-latest
    needs: [version, image]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        env:
          WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_PROD }}
        run: .github/scripts/deploy.sh "$WEBHOOK" https://doe.dingen.app/api/health "${{ needs.version.outputs.short }}"

  ha-addon:
    runs-on: ubuntu-latest
    needs: [version, image]
    steps:
      - uses: actions/checkout@v4
      - name: Update the Home Assistant app
        env:
          DEPLOY_KEY: ${{ secrets.HA_ADDON_DEPLOY_KEY }}
        run: .github/scripts/ha-addon.sh "${{ needs.version.outputs.version }}"
