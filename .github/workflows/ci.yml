name: CI

# main is checked by the release workflow; every push to develop also
# publishes ghcr.io/kleijnict/dingen:develop for testing.
on:
  push:
    branches: [develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dingen:ci
      - name: Rooktest, container start en health-check
        run: |
          docker run -d --name dingen -p 8080:8080 dingen:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 1
          done
          docker logs dingen
          exit 1

  develop-image:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")-dev" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DINGEN_VERSION=${{ steps.v.outputs.version }}
            DINGEN_COMMIT=${{ steps.v.outputs.short }}
          tags: |
            ghcr.io/kleijnict/dingen:develop
            ghcr.io/kleijnict/dingen:sha-${{ steps.v.outputs.short }}
          labels: |
            org.opencontainers.image.title=Dingen (develop)
            org.opencontainers.image.source=https://github.com/KleijnICT/dingen-app
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to dev
        env:
          WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_DEV }}
        run: .github/scripts/deploy.sh "$WEBHOOK" https://deploy.dingen.app/health/dev "${{ steps.v.outputs.short }}"
