services:
  dingen:
    image: ghcr.io/kleijnict/dingen:latest
    ports:
      - "8080:8080"
    environment:
      # Decides what "today" is for the MCP server.
      DINGEN_TIMEZONE: Europe/Amsterdam
      # Who can create an account after the first one: closed (default),
      # invite (only with an invitation link) or open (anyone).
      # DINGEN_REGISTRATION: invite
    volumes:
      - dingen-data:/data
    restart: unless-stopped

volumes:
  dingen-data:
